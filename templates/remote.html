<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Пульт слайдов</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:min(760px,100%);padding:18px}.title{text-align:center;font-size:26px;font-weight:900;margin-bottom:16px}
.login{display:flex;gap:10px;margin-bottom:10px}.login input{flex:1;background:#171717;border:1px solid #444;border-radius:12px;color:#fff;padding:15px;font-size:20px}
.login button,.reset{border:0;border-radius:12px;padding:14px 16px;font-weight:900;background:#333;color:#fff}
.status{text-align:center;color:#aaa;font-weight:800;margin:12px 0 20px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.nav button{height:42vh;min-height:250px;border:0;border-radius:22px;font-size:clamp(24px,5vw,46px);font-weight:1000;cursor:pointer}
.prev{background:#252525;color:#fff}.next{background:#ffd21c;color:#111}
.nav button:active{transform:scale(.985);filter:brightness(.85)}
@media(max-width:600px){.wrap{padding:10px}.title{font-size:21px}.nav{gap:8px}.nav button{height:55vh;min-height:300px;font-size:25px}.login input{min-width:0}}
</style></head>
<body><div class="wrap">
<div class="title">ПУЛЬТ СЛАЙДОВ</div>
<div class="login"><input id="login" placeholder="Логин"><button onclick="saveLogin()">ПОДКЛЮЧИТЬ</button></div>
<button class="reset" onclick="resetLogin()">СБРОСИТЬ ЛОГИН</button>
<div id="status" class="status">Введите логин</div>
<div class="nav">
<button class="prev" onclick="send('prev')">←<br>НАЗАД</button>
<button class="next" onclick="send('next')">ВПЕРЁД<br>→</button>
</div>
</div>
<script>
const el=document.getElementById("login"),st=document.getElementById("status");
el.value=localStorage.getItem("pptLogin")||"";
function clean(v){return(v||"").trim().toLowerCase().replace(/[^a-zа-яё0-9_-]/gi,"").slice(0,40)}
function saveLogin(){el.value=clean(el.value);if(el.value)localStorage.setItem("pptLogin",el.value);status()}
function resetLogin(){localStorage.removeItem("pptLogin");el.value="";status()}
let commandLock=false;
async function send(command){if(commandLock)return;const login=clean(el.value);if(!login){alert("Введите логин");return}commandLock=true;try{await fetch("/api/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login,command})})}catch(e){}finally{setTimeout(()=>commandLock=false,120)}}try{await fetch("/api/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login,command})})}catch(e){}}
async function status(){const login=clean(el.value);if(!login){st.textContent="Введите логин";return}try{const d=await(await fetch("/api/status?login="+encodeURIComponent(login),{cache:"no-store"})).json();st.textContent="● "+d.online+" ПОДКЛЮЧЕНО · "+login.toUpperCase()}catch(e){st.textContent="Связь с сервером…"}}
setInterval(status,1500);status();
</script></body></html>
