<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Пульт слайдов</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202020;color:#fff;font-family:Arial,sans-serif;min-height:100vh;overflow:hidden}
.gear{position:fixed;right:16px;top:16px;width:46px;height:46px;border:0;border-radius:50%;background:#353535;color:#fff;font-size:23px;z-index:5}
.main{height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 14px 14px}.nav{width:min(900px,100%);height:min(76vh,680px);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.nav button{border:0;border-radius:24px;font-weight:900;font-size:clamp(25px,5vw,48px)}.prev{background:#414141;color:#fff}.next{background:#ffd42f;color:#171717}.nav button:active{transform:scale(.985);filter:brightness(.85)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:10;padding:18px;align-items:center;justify-content:center}.overlay.show{display:flex}
.panel{width:min(520px,100%);background:#292929;border:1px solid #444;border-radius:20px;padding:22px}.panel h2{margin:0 0 18px}.panel input{width:100%;padding:15px;border-radius:11px;border:1px solid #555;background:#1d1d1d;color:#fff;font-size:20px}
.row{display:flex;gap:10px;margin-top:10px}.row button,.close{padding:14px;border:0;border-radius:11px;font-weight:900}.row button{flex:1;background:#494949;color:#fff}.close{width:100%;background:#ffd42f;color:#171717;margin-top:16px}
.state{margin-top:18px;padding:14px;border-radius:12px;background:#1d1d1d;text-align:center;font-weight:900}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:#777}.dot.on{background:#39d353;box-shadow:0 0 10px #39d353}.sub{color:#aaa;font-size:13px;margin-top:7px}
@media(max-width:600px){.main{padding:70px 8px 8px}.nav{height:84vh;gap:8px}.nav button{border-radius:18px;font-size:25px}}
</style></head><body>
<button class="gear" onclick="settings(true)">⚙</button>
<div class="main"><div class="nav"><button class="prev" onclick="send('prev')">←<br>НАЗАД</button><button class="next" onclick="send('next')">ВПЕРЁД<br>→</button></div></div>
<div class="overlay" id="overlay"><div class="panel"><h2>НАСТРОЙКИ ПУЛЬТА</h2><input id="login" placeholder="Логин">
<div class="row"><button onclick="saveLogin()">ПОДКЛЮЧИТЬ</button><button onclick="resetLogin()">СБРОСИТЬ</button></div>
<div class="state"><span id="dot" class="dot"></span><span id="stateText">ПУЛЬТ НЕ ПОДКЛЮЧЕН</span><div id="stateSub" class="sub">Введите логин</div></div>
<button class="close" onclick="settings(false)">ГОТОВО</button></div></div>
<script>
const el=document.getElementById("login"),ov=document.getElementById("overlay"),dot=document.getElementById("dot"),stateText=document.getElementById("stateText"),stateSub=document.getElementById("stateSub");
el.value=localStorage.getItem("pptLogin")||"";
let activeLogin=clean(el.value);
function clean(v){return(v||"").trim().toLowerCase().replace(/[^a-zа-яё0-9_-]/gi,"").slice(0,40)}
function settings(show){ov.classList.toggle("show",show);if(show)refreshState()}
function saveLogin(){
  const login=clean(el.value); el.value=login;
  if(!login)return;
  activeLogin=login; localStorage.setItem("pptLogin",login);
  remoteHeartbeat(); refreshState();
}
function resetLogin(){
  activeLogin=""; localStorage.removeItem("pptLogin"); el.value="";
  refreshState();
}
let lock=false;
async function send(command){if(lock)return;const login=activeLogin;if(!login){settings(true);return}lock=true;try{await fetch("/api/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login,command})})}finally{setTimeout(()=>lock=false,120)}}
async function refreshState(){const login=activeLogin;if(!login){dot.className="dot";stateText.textContent="ПУЛЬТ НЕ ПОДКЛЮЧЕН";stateSub.textContent="Введите логин";return}try{const d=await(await fetch("/api/status?login="+encodeURIComponent(login),{cache:"no-store"})).json();const on=d.online>0;dot.className="dot"+(on?" on":"");stateText.textContent=on?"ПУЛЬТ ПОДКЛЮЧЕН":"ПУЛЬТ НЕ ПОДКЛЮЧЕН";stateSub.textContent=login.toUpperCase()+(on?" · устройств: "+d.online:" · ожидаем Windows-приложение")}catch(e){dot.className="dot";stateText.textContent="НЕТ СВЯЗИ С СЕРВЕРОМ";stateSub.textContent=login.toUpperCase()}}
setInterval(refreshState,1200);refreshState();

const remoteId=localStorage.getItem("pptRemoteId")||("web-"+Math.random().toString(36).slice(2)+Date.now().toString(36));
localStorage.setItem("pptRemoteId",remoteId);
async function remoteHeartbeat(){
  const login=activeLogin; if(!login)return;
  try{await fetch("/api/remote-heartbeat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login,remote_id:remoteId}),cache:"no-store"})}catch(e){}
}
setInterval(remoteHeartbeat,3000); remoteHeartbeat();

</script></body></html>
